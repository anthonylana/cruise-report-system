[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-db-reader"
version = "0.1.0"
description = "Read-only DBF reader with atomic snapshots and searchable tables"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Universal DB Reader contributors"}]
dependencies = []

[project.optional-dependencies]
dbfread = ["dbfread>=2.0.7"]
pandas = ["pandas>=1.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["universal_db_reader*"]

[tool.setuptools.package-data]
universal_db_reader = ["tables.example.json"]
